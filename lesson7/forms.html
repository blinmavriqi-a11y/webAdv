<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <fieldset><label for="firstname">First name:</label><br>
        <legend>Personal Information:</legend>
        <input type="text" id="firstname" name="firstname" placeholder="John" value="John" readonly><br>
        <label for="lastname">Last name:</label><br>
        <input type="text" id="lastname" name="lastname" placeholder="Doe" disabled><br><br>
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" placeholder="johndoe@gamil.com" required><br><br>
        <label for="password">password:</label>
        <input type="password" id="password" name="password" placeholder="********" size="40" required><br><br>
        <label>Gender:</label><br>
        <input type="radio" name="gender" id="male" value="male">
        <label for="male">Male:</label><br>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female:</label><br><br>
        <label>Hobbies:</label><br>
        <input type="checkbox" id="gaming" name="gaming" value="Gaming">
        <label for="gaming">Gaming</label><br>
        <input type="checkbox" id="football" name="football" value="Football">
        <label for="football">Football</label><br>
        <input type="checkbox" name="swimming" id="Swimming" value="Swimming">
        <label for="swimming">Swimming</label><br><br>
        <select name="pet" id="pet">
            <option value="Dog">Dog</option>
            <option value="Cat">Cat</option>
            <option value="Parrot">Parrot</option>
        </select><br><br>
        <textarea name="message" rows="10" cols="30" maxlength="50"></textarea><br><br>
        <input type="submit" id="submit" name="submit"><br>
</fieldset>
        
    </form>
</body>
</html>
